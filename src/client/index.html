<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BasedLand</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314211b'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23f5d56b'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: only light;
        --bg-0: #14211b;
        --bg-1: #203229;
        --panel: rgba(13, 20, 17, 0.82);
        --panel-border: rgba(173, 194, 147, 0.24);
        --text: #edf3dc;
        --muted: #b8c79f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(98, 137, 107, 0.22), transparent 30%),
          linear-gradient(180deg, var(--bg-1), var(--bg-0));
        color: var(--text);
        font-family: "Trebuchet MS", "Verdana", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .interactive {
        pointer-events: auto;
      }

      .panel {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(8px);
      }

      #title {
        top: 18px;
        left: 18px;
        padding: 12px 16px;
        min-width: 180px;
      }

      #title h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #title p,
      #hint,
      #message {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      #hint {
        left: 18px;
        bottom: 18px;
        padding: 10px 14px;
      }

      #message {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 10px 14px;
        color: var(--text);
        border-color: rgba(217, 169, 75, 0.28);
      }

      #editor-toggle {
        top: 18px;
        right: 18px;
        padding: 10px 14px;
        cursor: pointer;
        user-select: none;
      }

      #editor-dock {
        left: 18px;
        right: 18px;
        bottom: 64px;
        padding: 12px;
        max-height: 180px;
        overflow-x: auto;
        overflow-y: hidden;
        display: none;
      }

      #editor-dock.active {
        display: block;
      }

      #editor-groups {
        display: flex;
        gap: 14px;
        min-width: max-content;
      }

      .editor-group {
        min-width: 180px;
      }

      .editor-group h3 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .editor-grid {
        display: grid;
        grid-template-columns: repeat(4, 44px);
        gap: 8px;
      }

      .editor-item {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(173, 194, 147, 0.18);
        background: rgba(255, 255, 255, 0.03);
        padding: 0;
        cursor: pointer;
      }

      .editor-item.active {
        border-color: rgba(217, 169, 75, 0.9);
        box-shadow: 0 0 0 1px rgba(217, 169, 75, 0.5);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hud">
      <div id="title" class="panel">
        <h1>BasedLand</h1>
        <p id="online">Players online: 0</p>
      </div>
      <button id="editor-toggle" class="panel interactive" type="button">Map Maker: Off</button>
      <div id="hint" class="panel">WASD move, E interact, wheel zoom, M map maker, left paint, right erase.</div>
      <div id="message" class="panel">Connecting...</div>
      <div id="editor-dock" class="panel interactive">
        <div id="editor-groups"></div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
  </html>
