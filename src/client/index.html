<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BasedLand</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314211b'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23f5d56b'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: only light;
        --bg-0: #14211b;
        --bg-1: #203229;
        --panel: rgba(13, 20, 17, 0.82);
        --panel-border: rgba(173, 194, 147, 0.24);
        --text: #edf3dc;
        --muted: #b8c79f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(98, 137, 107, 0.22), transparent 30%),
          linear-gradient(180deg, var(--bg-1), var(--bg-0));
        color: var(--text);
        font-family: "Trebuchet MS", "Verdana", sans-serif;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .interactive {
        pointer-events: auto;
      }

      .panel {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(8px);
      }

      #title {
        top: 18px;
        left: 18px;
        padding: 12px 16px;
        min-width: 180px;
        z-index: 30;
      }

      #title h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #title p,
      #hint,
      #message {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      #hint {
        left: 18px;
        bottom: 18px;
        padding: 10px 14px;
        z-index: 30;
      }

      #message {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 10px 14px;
        color: var(--text);
        border-color: rgba(217, 169, 75, 0.28);
        z-index: 30;
      }

      #editor-toggle {
        top: 18px;
        right: 18px;
        padding: 10px 14px;
        cursor: pointer;
        user-select: none;
        z-index: 30;
      }

      #minimap {
        top: 72px;
        right: 18px;
        width: 220px;
        padding: 10px;
        z-index: 30;
      }

      #minimap h2 {
        margin: 0 0 8px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #minimap canvas {
        width: 100%;
        height: auto;
        border: 1px solid rgba(173, 194, 147, 0.18);
        background: rgba(6, 12, 10, 0.85);
        cursor: pointer;
      }

      #worldmap {
        inset: 48px;
        padding: 16px;
        display: none;
        z-index: 40;
      }

      #worldmap.active {
        display: block;
      }

      #worldmap-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      #worldmap-title {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #worldmap-close {
        border: 1px solid rgba(173, 194, 147, 0.18);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 8px 10px;
        cursor: pointer;
      }

      #worldmap-canvas {
        width: 100%;
        height: calc(100% - 44px);
        border: 1px solid rgba(173, 194, 147, 0.18);
        background: rgba(6, 12, 10, 0.88);
      }

      #editor-dock {
        left: 18px;
        right: 18px;
        bottom: 64px;
        padding: 12px;
        max-height: 320px;
        overflow: hidden;
        display: none;
      }

      #editor-dock.active {
        display: block;
      }

      #editor-groups {
        min-width: 100%;
      }

      .editor-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .editor-tab {
        border: 1px solid rgba(173, 194, 147, 0.2);
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .editor-tab.active {
        color: var(--text);
        border-color: rgba(217, 169, 75, 0.9);
        box-shadow: 0 0 0 1px rgba(217, 169, 75, 0.35);
      }

      .editor-group {
        min-width: 100%;
        max-height: 210px;
        overflow-y: auto;
        padding-right: 6px;
      }

      .editor-group h3 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .editor-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
        gap: 8px;
      }

      .editor-tools {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .editor-brushes {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 4px 6px;
        border: 1px solid rgba(173, 194, 147, 0.2);
        background: rgba(255, 255, 255, 0.04);
      }

      .editor-brush-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .editor-action {
        border: 1px solid rgba(173, 194, 147, 0.2);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .editor-brush {
        min-width: 42px;
        text-align: center;
      }

      .editor-brush.active {
        border-color: rgba(217, 169, 75, 0.9);
        box-shadow: 0 0 0 1px rgba(217, 169, 75, 0.5);
      }

      .editor-item {
        min-height: 84px;
        border: 1px solid rgba(173, 194, 147, 0.18);
        background: rgba(255, 255, 255, 0.03);
        padding: 6px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
      }

      .editor-item.active {
        border-color: rgba(217, 169, 75, 0.9);
        box-shadow: 0 0 0 1px rgba(217, 169, 75, 0.5);
      }

      .editor-item canvas {
        width: 40px;
        height: 40px;
        display: block;
        image-rendering: pixelated;
      }

      .editor-item-label {
        display: block;
        width: 100%;
        font-size: 10px;
        line-height: 1.1;
        color: var(--muted);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hud">
      <div id="title" class="panel">
        <h1>BasedLand</h1>
        <p id="online">Players online: 0</p>
      </div>
      <button id="editor-toggle" class="panel interactive" type="button">Map Maker: Off</button>
      <div id="minimap" class="panel interactive">
        <h2>World Map</h2>
        <canvas id="minimap-canvas" width="200" height="200"></canvas>
      </div>
      <div id="worldmap" class="panel interactive">
        <div id="worldmap-header">
          <h2 id="worldmap-title">Full World Map</h2>
          <button id="worldmap-close" type="button">Close</button>
        </div>
        <canvas id="worldmap-canvas" width="960" height="720"></canvas>
      </div>
      <div id="hint" class="panel">WASD move, E interact, wheel zoom, click minimap to pan, M map maker.</div>
      <div id="message" class="panel">Connecting...</div>
      <div id="editor-dock" class="panel interactive">
        <div class="editor-tools">
          <div class="editor-brushes">
            <span class="editor-brush-label">Brush</span>
            <button id="editor-brush-1" class="editor-action editor-brush" type="button">1x1</button>
            <button id="editor-brush-2" class="editor-action editor-brush" type="button">2x2</button>
            <button id="editor-brush-4" class="editor-action editor-brush" type="button">4x4</button>
            <button id="editor-brush-8" class="editor-action editor-brush" type="button">8x8</button>
          </div>
          <button id="editor-save-online" class="editor-action" type="button">Save Online</button>
          <button id="editor-load-online" class="editor-action" type="button">Load Online</button>
          <button id="editor-export" class="editor-action" type="button">Backup JSON</button>
          <button id="editor-import-button" class="editor-action" type="button">Restore JSON</button>
          <button id="editor-save-local" class="editor-action" type="button">Save Local</button>
          <button id="editor-load-local" class="editor-action" type="button">Load Local</button>
          <button id="editor-clear" class="editor-action" type="button">Clear</button>
          <input id="editor-import-input" type="file" accept="application/json" hidden />
        </div>
        <div id="editor-groups"></div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
  </html>
